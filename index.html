<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VanillaCloud • Live Map</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Segoe UI,Arial,sans-serif;
}

iframe{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border:none;
}

.logo{
    position:fixed;
    top:22px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;

    font-size:58px;
    font-weight:900;
    letter-spacing:-2px;

    color:#fff;

    user-select:none;
    pointer-events:none;

    text-shadow:
    0 0 8px rgba(0,0,0,.8),
    0 0 18px rgba(0,0,0,.6);
}

.logo span{
    color:#b45cff;
}

</style>

</head>

<body>

<div class="logo">
    <span>Vanilla</span>Cloud
</div>

<iframe
src="http://87.228.74.140:25717"
allowfullscreen>
</iframe>

</body>
</html>
